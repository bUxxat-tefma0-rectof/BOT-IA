<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Bot IA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: #e74c3c; margin-bottom: 30px; }
        .card { background: #16213e; border-radius: 15px; padding: 25px; margin-bottom: 20px; }
        .card h2 { color: #e74c3c; margin-bottom: 15px; }
        .stat { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #333; }
        .stat:last-child { border: none; }
        .stat span:last-child { font-weight: bold; color: #2ecc71; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background: #e74c3c; color: white; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #333; }
        .btn { background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #c0392b; }
        input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #1a1a2e; color: #eee; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Painel Admin - Bot IA</h1>
        
        <div class="card">
            <h2>📊 Estatísticas</h2>
            <div class="stat"><span>👥 Total Usuários</span><span id="totalUsers">...</span></div>
            <div class="stat"><span>💰 Faturamento</span><span id="faturamento">...</span></div>
            <div class="stat"><span>🎯 Total Gerado</span><span id="totalGerado">...</span></div>
            <div class="stat"><span>📅 Recargas Hoje</span><span id="recargasHoje">...</span></div>
        </div>
        
        <div class="card">
            <h2>👤 Adicionar Créditos</h2>
            <input type="text" id="userId" placeholder="ID do Telegram do usuário">
            <input type="number" id="creditos" placeholder="Quantidade de créditos">
            <button class="btn" onclick="addCreditos()">✅ Adicionar</button>
        </div>
        
        <div class="card">
            <h2>📢 Broadcast</h2>
            <input type="text" id="broadcastMsg" placeholder="Mensagem para todos os usuários">
            <button class="btn" onclick="broadcast()">📢 Enviar para Todos</button>
        </div>
        
        <div class="card">
            <h2>📋 Últimas Recargas</h2>
            <table id="recargasTable">
                <thead><tr><th>Usuário</th><th>Valor</th><th>Créditos</th><th>Status</th><th>Data</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    
    <script>
        async function loadStats() {
            const resp = await fetch('/api/admin/stats');
            const data = await resp.json();
            document.getElementById('totalUsers').textContent = data.totalUsers;
            document.getElementById('faturamento').textContent = 'R$ ' + data.faturamento.toFixed(2);
            document.getElementById('totalGerado').textContent = data.totalGerado;
            document.getElementById('recargasHoje').textContent = data.recargasHoje;
        }
        
        async function addCreditos() {
            const userId = document.getElementById('userId').value;
            const creditos = document.getElementById('creditos').value;
            if (!userId || !creditos) return alert('Preencha todos os campos');
            
            const resp = await fetch('/api/admin/add-creditos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, creditos: parseInt(creditos) })
            });
            const data = await resp.json();
            alert(data.mensagem);
            loadStats();
        }
        
        async function broadcast() {
            const msg = document.getElementById('broadcastMsg').value;
            if (!msg) return alert('Digite a mensagem');
            
            const resp = await fetch('/api/admin/broadcast', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mensagem: msg })
            });
            const data = await resp.json();
            alert(data.mensagem);
        }
        
        loadStats();
        setInterval(loadStats, 30000);
    </script>
</body>
</html>
